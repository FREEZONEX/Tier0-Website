# To be reviewed/applied by operations in the existing Nginx http/server context.
# Do not replace the site's existing locations, TLS, sub_filter or proxy config.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/manifest+json application/xml image/svg+xml;
# text/html is included by Nginx automatically. Do not gzip already-compressed video/PDF/woff2.
